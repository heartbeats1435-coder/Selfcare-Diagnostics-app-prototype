<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0284C7">
  <meta name="description" content="Selfcare Diagnostics - Production Mobile App for Home Blood Collection & Diagnostic Reports">
  <title>Selfcare Diagnostics</title>

  <!-- PWA Web Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- Core App Stylesheets -->
  <link rel="stylesheet" href="variables.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>

  <!-- Main Mobile Framing Viewport -->
  <div id="app">

    <!-- Top Header App Bar -->
    <header class="app-header">
      <div class="app-brand">
        <div class="app-logo">S</div>
        <span class="app-title">Selfcare</span>
      </div>
      <div class="app-actions">
        <button id="btn-theme-toggle" class="btn-icon" aria-label="Toggle Theme" onclick="Store.toggleTheme()">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Offline Alert Banner -->
    <div class="offline-banner">
      ⚡ Offline Mode - Displaying cached diagnostic records
    </div>

    <!-- Scrollable Screen Mount Target -->
    <main id="main-content" class="app-content">
      <!-- Dynamic SPA views render here -->
    </main>

    <!-- Bottom Navigation Bar (MD3) -->
    <nav class="bottom-nav">
      <a class="nav-item active" data-route="home" onclick="Router.navigate('home')">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <span>Home</span>
      </a>
      <a class="nav-item" data-route="tests" onclick="Router.navigate('tests')">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </div>
        <span>Tests</span>
      </a>
      <a class="nav-item" data-route="cart" onclick="Router.navigate('cart')">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
        <span>Cart</span>
      </a>
      <a class="nav-item" data-route="reports" onclick="Router.navigate('reports')">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        </div>
        <span>Reports</span>
      </a>
      <a class="nav-item" data-route="profile" onclick="Router.navigate('profile')">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JS Dependencies & Modules -->
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="router.js"></script>
  <script src="auth.js"></script>
  <script src="ai-engine.js"></script>
  <script src="home.js"></script>
  <script src="cart.js"></script>
  <script src="maps.js"></script>
  <script src="reports.js"></script>
  <script src="payment.js"></script>
  <script src="technician.js"></script>
  <script src="admin.js"></script>
  <script src="notification.js"></script>
  <script src="sync.js"></script>
  <script src="performance.js"></script>
  <script src="ui-render.js"></script>

  <script>
    // Boot Store & Router Theme Initialization
    Store.initTheme();
  </script>
</body>
</html>
